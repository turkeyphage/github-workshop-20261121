<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待辦事項清單 - To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- 標題和深色模式切換 -->
            <div class="header-row">
                <h1 class="title">待辦事項</h1>
                <button id="themeToggleBtn" class="theme-toggle-btn" title="切換深色模式">
                    <span class="theme-icon">🌙</span>
                    <span class="theme-text">深色模式</span>
                </button>
            </div>
            
            <!-- 輸入區域 -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="新增待辦事項..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">新增</button>
            </div>

            <!-- 篩選按鈕 -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="pending">未完成</button>
                <button class="filter-btn" data-filter="completed">已完成</button>
            </div>

            <!-- 待辦事項清單 -->
            <ul id="todoList" class="todo-list"></ul>

            <!-- 空狀態訊息 -->
            <div id="emptyState" class="empty-state">
                <p class="empty-icon">✨</p>
                <p class="empty-text">沒有待辦事項，享受閒暇時光吧！</p>
            </div>

            <!-- 底部統計 -->
            <div class="footer">
                <span id="remainingCount" class="remaining-count">剩餘: 0</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
